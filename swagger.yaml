        grossSalesPaise:
          type: integer
          description: Sum of total_paise on paid orders for this event. Gross collected — NOT a payout figure. Settlement/payouts are a separate, future feature.

    OrganizerProfileCard:
      type: object
      description: |
        The base profile-card shape shared by OrganizerAttendee and OrganizerInvitation. Deliberately has NO phone and NO email properties — the backend's fetchAttendeeProfiles() never selects those columns in the first place, so there's nothing to leak even if a serializer bug existed. Organizers get profile cards only; Cirkle handles all attendee communication.

        Social handles (facebook/instagram/linkedin) ARE included: an event can require them before a user may buy or request an invitation, and the organizer needs to see them when deciding. That is a deliberate widening of the visible set — it does not extend to contact info, which remains absent by construction.
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        age:
          type: integer
          nullable: true
        gender:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        tagline:
          type: string
          nullable: true
        facebook:
          type: string
          nullable: true
          description: Bare handle, null if the attendee hasn't given one. Self-entered, not OAuth-verified.
        instagram:
          type: string
          nullable: true
          description: Bare handle, null if the attendee hasn't given one. Self-entered, not OAuth-verified.
        linkedin:
          type: string
          nullable: true
          description: Bare vanity slug, null if the attendee hasn't given one. Self-entered, not OAuth-verified.
        photos:
          type: array
          items:
            $ref: '#/components/schemas/CardPhoto'
        lifestyleTags:
          type: array
          items:
            $ref: '#/components/schemas/CardLifestyleTag'

    CardPhoto:
      type: object
      description: >-
        A photo as it appears on someone else's profile card (organizer
        attendee/invitation lists, vibe cards). Unlike the shared Photo schema
        this has NO id — those serializers never select it, since a viewer
        looking at another person's card has no reason to address an
        individual photo row.
      properties:
        url:
          type: string
          description: Presigned GET URL, ~1 hour TTL. The bucket is private — expires, don't cache long-term.
        position:
          type: integer
          minimum: 0
          maximum: 3
          description: Position 0 is the Main photo

    CardLifestyleTag:
      type: object
      description: >-
        A lifestyle tag as it appears on someone else's profile card. Unlike
        the shared LifestyleTag schema this has NO id.
      properties:
        label:
          type: string
          example: Clubbing
        category:
          type: string
          example: Going out

    OrganizerAttendee:
      description: A ticket-holder for the organizer's event. No phone/email — see OrganizerProfileCard.
      allOf:
        - type: object
          properties:
            ticketId:
              type: string
              format: uuid
            checkedIn:
              type: boolean
              description: Convenience flag — true when checkedInAt is non-null.
            checkedInAt:
              type: string
              format: date-time
              nullable: true
              description: When the attendee was checked in at the door, or null if they haven't been.
        - $ref: '#/components/schemas/OrganizerProfileCard'

    OrganizerInvitation:
      description: An invitation request for the organizer's event. No phone/email — see OrganizerProfileCard.
      allOf:
        - type: object
          properties:
            invitationId:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, accepted, rejected]
            requestedAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/OrganizerProfileCard'

    City:
      type: object
      properties:
        id:
          type: string
          example: del
          description: City slug identifier
        name:
          type: string
          example: Delhi NCR

    EventCategory:
      type: object
      properties:
        id:
          type: string
          example: club
          description: Category slug identifier — used in ?category= query params
        label:
          type: string
          example: Clubs

    LifestyleTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: be1c46e0-e44b-4776-89fd-e15b97b95fc7
        label:
          type: string
          example: Clubbing
        category:
          type: string
          example: Going out

    Gender:
      type: string
      description: >-
        Immutable once set. Mirrors the profiles.gender CHECK constraint —
        keep this enum in sync with the allowed lists in onboarding.js and
        profile.js if the constraint ever changes.
      enum: [man, woman, non_binary, prefer_not_to_say]
      example: woman

    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: Presigned GET URL, ~1 hour TTL. The bucket is private — never cache this long-term, it expires. Generated fresh on every read.
          example: https://cirkle-user-photos.s3.ap-south-1.amazonaws.com/profiles/user-id/photo-0.jpg?X-Amz-Signature=...
        position:
          type: integer
          minimum: 0
          maximum: 3
          description: Position 0 is the Main photo

    Profile:
      type: object
      properties:
        firstName:
          type: string
          example: Sayantan
        lastName:
          type: string
          example: Roy
        age:
          type: integer
          example: 26
          description: Derived from DOB on read — DOB is never returned directly
        gender:
          type: string
          enum: [man, woman, non_binary, prefer_not_to_say]
          description: Immutable once set
        cityId:
          type: string
          example: del
        email:
          type: string
          example: sayantan@cirkle.live
        bio:
          type: string
          nullable: true
          example: Love live music
        tagline:
          type: string
          nullable: true
          example: Always up for an adventure
        facebook:
          type: string
          nullable: true
          description: >-
            Bare handle. Accepts a handle, @handle, profile URL, or
            facebook.com/profile.php?id=N on write; always stored and returned
            bare. Send '' or null to clear. Self-entered — OAuth verification
            is deferred, so this proves intent, not identity.
          example: sayantan.roy
        instagram:
          type: string
          nullable: true
          description: Bare handle. Same write/normalization rules as facebook.
          example: sayantanroy
        linkedin:
          type: string
          nullable: true
          description: Bare vanity slug. A linkedin.com/in/<slug> URL normalizes to <slug>.
          example: sayantan-roy
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        lifestyleTags:
          type: array
          items:
            $ref: '#/components/schemas/LifestyleTag'

    SocialHandlesRequired:
      type: object
      description: >-
        The 403 returned by POST /payments/orders and POST /events/{id}/invitations
        when the event requires social handles the user hasn't supplied.

        Branch on `error` — it distinguishes this from every other 403 on those
        endpoints (an invite-only event needing an accepted invitation returns a
        different body). Use `missing` to decide which fields the handle dialog
        should show. Never parse `message`.
      properties:
        error:
          type: string
          enum: [social_handles_required]
        missing:
          type: array
          description: Exactly the required handles the user lacks, in a stable order.
          items:
            type: string
            enum: [facebook, instagram, linkedin]
          example: [instagram, linkedin]
        message:
          type: string
          description: Human-readable, for logging or a fallback. Not a stable contract.

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Sunidhi Chauhan Live
        categoryId:
          type: string
          example: concert
        cityId:
          type: string
          example: del
        startsAt:
          type: string
          format: date-time
          example: "2026-08-14T19:00:00+05:30"
        endsAt:
          type: string
          format: date-time
          nullable: true
        price:
          type: integer
          example: 50000
          description: In paise. ₹500 = 50000
        targetGroupSize:
          type: integer
          example: 4
        venueName:
          type: string
          example: Jawaharlal Nehru Stadium
        venueAddress:
          type: string
          example: Lodhi Road, New Delhi
        description:
          type: string
          nullable: true
        bannerUrl:
          type: string
          nullable: true
          description: Presigned GET URL, ~1 hour TTL. Never a raw S3 key — the bucket is private. Generated fresh on every read.
        gallery:
          type: array
          description: Up to 5 additional images, separate from the banner. Only present on GET /events/{id}, not the list endpoint.
          items:
            type: object
            properties:
              url:
                type: string
                description: Presigned GET URL, same TTL/freshness rules as bannerUrl
              position:
                type: integer
                minimum: 0
                maximum: 4
        artists:
          type: array
          description: The lineup, ordered by position (0 = headliner). Empty array when the event has no artists. Only present on GET /events/{id}, not the list endpoint.
          items:
            $ref: '#/components/schemas/EventArtist'
        requireFacebook:
          type: boolean
          description: >-
            Whether this event requires the user's Facebook handle before they
            may buy a ticket or request an invitation. Exposed so the app can
            warn up front; the gate itself is enforced server-side at purchase
            and request time. Only present on GET /events/{id}.
        requireInstagram:
          type: boolean
          description: As requireFacebook, for Instagram.
        requireLinkedin:
          type: boolean
          description: As requireFacebook, for LinkedIn.
        organizerInstagram:
          type: string
          nullable: true
          description: >-
            The event organizer's Instagram handle, for an icon link. Null when
            the event has no organizer or the organizer set no handle. This is
            deliberately the ONLY organizer field on the consumer response — no
            name, no email. Only present on GET /events/{id}.
          example: kittysu
        userHasTicket:
          type: boolean
          description: Whether the requesting user already holds a ticket to this event (only present on GET /events/{id})
        soldOut:
          type: boolean
          description: Whether a capped event has no seats left (only present on GET /events/{id})
        eventType:
          type: string
          enum: [open, invite_only]
          description: If invite_only, an accepted invitation is required before POST /payments/orders will succeed (only present on GET /events/{id})
        invitationStatus:
          type: string
          nullable: true
          enum: [pending, accepted, rejected]
          description: The requesting user's invitation status for an invite_only event. Null if no request has been made yet, or if the event is open (only present on GET /events/{id})

    PriceBreakdown:
      type: object
      description: All amounts in paise. GST is computed on the post-discount subtotal.
      properties:
        basePricePaise:
          type: integer
          example: 50000
        discountPaise:
          type: integer
          example: 10000
          description: Clamped to base price — never exceeds it
        subtotalPaise:
          type: integer
          example: 40000
          description: base − discount
        gstPercentage:
          type: number
          example: 18
        gstPaise:
          type: integer
          example: 7200
          description: Rounded to the nearest paisa
        totalPaise:
          type: integer
          example: 47200
          description: What Razorpay charges

    OrderCreated:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          description: Cirkle's order ID — used for status polling
        razorpayOrderId:
          type: string
          example: order_Nx8kL2mP9qR3sT
          description: Razorpay's order ID — passed to the checkout SDK
        razorpayKeyId:
          type: string
          example: rzp_test_XXXXXXXX
          description: Public key ID for the checkout SDK
        amount:
          type: integer
          example: 47200
          description: Total in paise, equals breakdown.totalPaise
        currency:
          type: string
          example: INR
        expiresAt:
          type: string
          format: date-time
          description: When the seat hold lapses
        resumed:
          type: boolean
          description: True if an existing live hold was returned instead of a new order
        breakdown:
          $ref: '#/components/schemas/PriceBreakdown'

    TicketListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: CRKL-7F3A2C9E
        checkedIn:
          type: boolean
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            categoryId:
              type: string
            startsAt:
              type: string
              format: date-time
            venueName:
              type: string
            venueAddress:
              type: string
            bannerUrl:
              type: string
              nullable: true
              description: Presigned GET URL, ~1 hour TTL. Never a raw S3 key — the bucket is private. Null if the event has no banner.

    TicketDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: CRKL-7F3A2C9E
          description: The string the QR code encodes
        checkedIn:
          type: boolean
        pricePaid:
          type: integer
          example: 47200
          description: In paise
        bookedAt:
          type: string
          format: date-time
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            categoryId:
              type: string
            startsAt:
              type: string
              format: date-time
            venueName:
              type: string
            venueAddress:
              type: string
            bannerUrl:
              type: string
              nullable: true
              description: Presigned GET URL, ~1 hour TTL. Never a raw S3 key — the bucket is private. Null if the event has no banner.

    PersonCard:
      type: object
      description: >-
        How one other person is shown to a consumer — the shape returned by
        both GET /vibes (as VibeCard.person) and GET /events/{id}/attendees.
        Defined once so the two can never drift.

        Narrower than the organizer-facing OrganizerProfileCard by design. It
        carries no lastName, no bio, and no social handles, and — like every
        consumer response — no phone or email. The backing query
        (fetchPublicAttendeeProfiles) never selects those columns, so they
        cannot appear even if a serializer were wrong. age is computed in SQL;
        date_of_birth is never selected.
      properties:
        id:
          type: string
          format: uuid
          description: The person's user id
        firstName:
          type: string
          example: Priya
        age:
          type: integer
          example: 26
          description: Derived from date of birth in SQL — the DOB itself is never returned
        gender:
          $ref: '#/components/schemas/Gender'
        tagline:
          type: string
          nullable: true
          example: Always up for an adventure
        photos:
          type: array
          description: Empty array when the person has no photos — render an initial-based avatar
          items:
            $ref: '#/components/schemas/CardPhoto'
        lifestyleTags:
          type: array
          items:
            $ref: '#/components/schemas/CardLifestyleTag'

    EventAttendee:
      description: >-
        One person attending an event. PersonCard plus isYou. Carries the full
        card, so tapping a name can render their profile straight from this
        payload without a second request — there is no profile-by-id endpoint.
      allOf:
        - $ref: '#/components/schemas/PersonCard'
        - type: object
          properties:
            isYou:
              type: boolean
              description: >-
                True on the viewer's own row. The viewer is included when they
                hold a ticket, flagged rather than filtered out, so that total
                always equals the real number of people attending.

    VibeCard:
      type: object
      description: One upcoming ticket held by someone other than the viewer.
      properties:
        ticketId:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonCard'
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: Saturday Night at Kitty Su
            categoryId:
              type: string
              example: club
            cityId:
              type: string
              example: del
            startsAt:
              type: string
              format: date-time
            venueName:
              type: string
            eventType:
              type: string
              enum: [open, invite_only]
            goingCount:
              type: integer
              description: Total confirmed tickets to this event, including the card's person
              example: 4

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No token provided

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation error message

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error

    OnboardingStepSuccess:
      description: Step saved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              currentOnboardingStep:
                type: integer
          example:
            success: true
            currentOnboardingStep: 1