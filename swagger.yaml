                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Admin — Organizers]
      summary: Update an organizer
      description: |
        Partial update. Including `password` re-hashes and resets the organizer's login — this is how an admin resets a forgotten password. `isActive: false` disables their login without deleting the account.

        Writes an audit_log row with only the fields that actually changed (`{ field: { from, to } }`). If password was changed, the audit records that a password was set, never its value.
      security: [{ bearerAuth: [] }]
