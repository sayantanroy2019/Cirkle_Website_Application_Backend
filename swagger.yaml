      responses:
        '200':
          description: Organizer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizer:
                    $ref: '#/components/schemas/Organizer'
        '400':
          description: Validation error, or no fields provided to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Organizer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The new email is already taken by another organizer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
