  /admin/events:
    post:
      tags: [Admin — Events]
      summary: Create an event
      description: |
        No images at creation — a new event needs an id before images can be keyed to `events/{eventId}/...`. Upload the banner/gallery afterward via the endpoints below, using the returned id.

        Writes an audit_log row (action create, entity_type event).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId, cityId, startsAt, price, targetGroupSize]
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                  example: club
                cityId:
                  type: string
                  example: del
                startsAt:
                  type: string
                  format: date-time
                  description: Must be in the future
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
                price:
                  type: integer
                  description: Paise, ₹500 = 50000
                capacity:
                  type: integer
                  nullable: true
                  description: Omit or null for uncapped
                targetGroupSize:
                  type: integer
                eventType:
                  type: string
                  enum: [open, invite_only]
                  description: Defaults to open
                venueName:
                  type: string
                  nullable: true
                venueAddress:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                organizerId:
                  type: string
                  format: uuid
                  nullable: true
