                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/orders/{id}:
    get:
      tags: [Admin — Orders]
      summary: Get full order detail
      description: Everything from the list view plus the coupon used (if any) and the linked ticket (if the order is paid).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    allOf:
                      - $ref: '#/components/schemas/AdminOrder'
                      - type: object
                        properties:
                          coupon:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              code:
                                type: string
                              discountFlatPaise:
                                type: integer
                          ticket:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: string
                                format: uuid
                              bookingRef:
                                type: string
                              checkedIn:
                                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/tickets:
    get:
      tags: [Admin — Tickets]
      summary: List tickets
      description: Filtered by eventId alone, this is effectively the venue guest list for that event.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          name: checkedIn
          schema:
            type: string
            enum: ['true', 'false']
          required: false
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
          required: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of tickets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminTicket'
        '400':
          description: checkedIn must be true or false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/tickets/{id}:
    get:
      tags: [Admin — Tickets]
      summary: Get ticket detail
      description: Everything from the list view plus which order it came from and the price paid.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    allOf:
                      - $ref: '#/components/schemas/AdminTicket'
                      - type: object
                        properties:
                          order:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              pricePaidPaise:
                                type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/revenue:
    get:
      tags: [Admin — Revenue]
      summary: Overall revenue summary
      description: |
        Computed only from status='paid' orders — created/failed/expired orders never count.

        Refunded orders are deliberately excluded from the collected totals and surfaced separately as refundedPaise, so the numbers read as "collected X, refunded Y" rather than a netted figure that hides both.

        Math: grossPaise - discountsPaise = netBeforeGstPaise; netBeforeGstPaise + gstCollectedPaise = totalCollectedPaise.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/revenue/by-event:
    get:
      tags: [Admin — Revenue]
      summary: Revenue broken down per event
      description: Same breakdown as GET /admin/revenue, grouped per event — "how is each event performing." Paginated.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated per-event revenue breakdown
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RevenueByEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/invitations:
    get:
      tags: [Admin — Invitations]
      summary: List invitation activity across every organizer
      description: The global view. The organizer dashboard will later show a scoped (own-events-only) version of this.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, rejected]
          required: false
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
          required: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminInvitation'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users:
    get:
      tags: [Admin — Users]
      summary: Search and list users
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Matched case-insensitively, partial, against phone, email, first name, and last name
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdminUserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/users/{id}:
    get:
      tags: [Admin — Users]
      summary: Full user detail — the support-lookup screen
      description: Complete profile (presigned photo URLs, lifestyle tags, bio, tagline), phone, email, derived age, plus full order and ticket history.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full user detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AdminUserDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── ORGANIZER DASHBOARD ────────────────────────────────────────────────

  /organizer/auth/login:
    post:
      tags: [Organizer]
      summary: Organizer login
      description: |
        Email/password login. Separate identity space from both attendee phone auth and admin auth — signed with a distinct secret (ORGANIZER_JWT_SECRET), so this token can never authenticate against attendee or admin routes, and vice versa.

        Deliberately generic 401 on unknown email, wrong password, or a deactivated account — never reveals which.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT valid for 7 days, signed with ORGANIZER_JWT_SECRET
                  organizer:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                      displayName:
                        type: string
        '400':
          description: Missing or malformed email/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials, or the account is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'

  /organizer/events:
    get:
      tags: [Organizer]
      summary: List this organizer's events
      description: Scoped to req.organizer.organizerId from the token — never from a request parameter. Only this organizer's events are ever returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of the organizer's events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizerEventSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizer/events/{id}:
    get:
      tags: [Organizer]
      summary: Get full detail of one of this organizer's events
      description: |
        Ownership-checked — returns 404 (not 403) if the event isn't this organizer's, so existence is never confirmed to someone who shouldn't see it.

        Includes grossSalesPaise: sum of total_paise on paid orders for this event. This is informational only — gross collected, NOT a payout figure. Settlement/payouts are a separate, future feature.

        View-only. There is no PATCH/POST/DELETE here — organizers contact admin to change event details.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/OrganizerEventDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found (also returned if it belongs to a different organizer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizer/events/{id}/attendees:
    get:
      tags: [Organizer]
      summary: List ticket-holders for this event (the guest list)
      description: |
        Ownership-checked, same 404-not-403 rule as above.

        Profile cards only — first name, last name, age, gender, bio, tagline, lifestyle tags, presigned photo URLs, and check-in status. **Phone and email are never included, not sent and hidden, simply never selected from the database.** Cirkle handles all attendee communication.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of attendee profile cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizerAttendee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found (also returned if it belongs to a different organizer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizer/events/{id}/invitations:
    get:
      tags: [Organizer]
      summary: List invitation requests for this event
      description: |
        Ownership-checked, same 404-not-403 rule as above. Filterable by status, defaulting to pending (the actionable set).

        Same profile-card treatment as attendees — no phone/email, ever.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, accepted, rejected]
            default: pending
          required: false
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of invitation profile cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrganizerInvitation'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found (also returned if it belongs to a different organizer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /organizer/invitations/{invitationId}/decision:
    post:
      tags: [Organizer]
      summary: Accept or reject an invitation request
      description: |
        The one write action in the organizer dashboard. Ownership is checked via event_invitations.organizer_id — 404 if the invitation doesn't belong to this organizer, never 403.

        The invitation must currently be pending. Already-decided invitations (accepted or rejected) are terminal — 409, no un-deciding or re-deciding.

        Accepting flows straight into the existing consumer purchase gate (POST /payments/orders already checks for an accepted invitation) — no change needed there.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitationId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [accepted, rejected]
        '400':
          description: decision must be 'accept' or 'reject'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invitation not found (also returned if it belongs to a different organizer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This invitation has already been decided — terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This invitation has already been accepted
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── ONBOARDING ───────────────────────────────────────────────────────

  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: Get onboarding status
      description: Returns the current onboarding step and Feed access flag for the logged-in user. The frontend calls this on app launch to decide where to route the user — onboarding screen N, or straight to the Feed.
      responses:
        '200':
          description: Current onboarding progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentOnboardingStep:
                    type: integer
                    minimum: 0
                    maximum: 7
                  partialProfileComplete:
                    type: boolean
              example:
                currentOnboardingStep: 3
                partialProfileComplete: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/1:
    patch:
      tags: [Onboarding]
      summary: Step 1 — Save name
      description: Saves the user's first and last name. Both are required, minimum 2 characters each. Displayed publicly as "FirstName, Age" everywhere on the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                  minLength: 2
                  example: Sayantan
                lastName:
                  type: string
                  minLength: 2
                  example: Roy
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/2:
    patch:
      tags: [Onboarding]
      summary: Step 2 — Save date of birth
      description: Saves the user's date of birth in YYYY-MM-DD format. DOB is stored but never returned by any API — age is derived on read. No age restriction enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateOfBirth]
              properties:
                dateOfBirth:
                  type: string
                  format: date
                  example: "2000-05-15"
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/3:
    patch:
      tags: [Onboarding]
      summary: Step 3 — Save gender
      description: Saves the user's gender. Must be one of the four allowed values. Gender is immutable once set — it cannot be changed via Edit Profile later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gender]
              properties:
                gender:
                  type: string
                  enum: [man, woman, non_binary, prefer_not_to_say]
                  example: man
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/4:
    patch:
      tags: [Onboarding]
      summary: Step 4 — Save city
      description: Saves the user's home city. Must be a valid city slug from GET /cities. Determines which events and groups the user sees by default in the Feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cityId]
              properties:
                cityId:
                  type: string
                  example: del
                  description: Must be a valid city slug from GET /cities
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/5:
    patch:
      tags: [Onboarding]
      summary: Step 5 — Save lifestyle tags
      description: Saves the user's lifestyle tag selections. Min 3, max 5. Replaces the entire existing selection — send the full desired set, not a diff. These tags appear on the user's anchor card in the Groups feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifestyleTagIds]
              properties:
                lifestyleTagIds:
                  type: array
                  minItems: 3
                  maxItems: 5
                  items:
                    type: string
                    format: uuid
                  example:
                    - be1c46e0-e44b-4776-89fd-e15b97b95fc7
                    - 54e18447-c11a-4613-9b18-6e71f8012f2a
                    - f184d05f-24ec-4148-953f-7f007fcaf7bc
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/6:
    patch:
      tags: [Onboarding]
      summary: Step 6 — Save photos
      description: |
        Saves the user's profile photos. Min 2, max 4. Position 0 is the Main photo and is required. Replaces the entire existing photo set on every call.

        Each `s3Key` must come from `POST /uploads/profile-photo-url` and must have actually been uploaded to S3 — this endpoint verifies every key exists in the bucket (via HeadObject) before saving anything. All-or-nothing: if any key fails verification, the whole request is rejected and no photos are saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    required: [s3Key, position]
                    properties:
                      s3Key:
                        type: string
                        example: profiles/user-id/photo-0.jpg
                        description: The key returned by POST /uploads/profile-photo-url, after the file has been PUT to S3
                      position:
                        type: integer
                        minimum: 0
                        maximum: 3
                        description: Position 0 is the Main photo
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          description: Validation error, or one or more photos were not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    error: Upload between 2 and 4 photos
                notUploaded:
                  value:
                    error: One or more photos were not uploaded successfully. Please try again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/7:
    patch:
      tags: [Onboarding]
      summary: Step 7 — Save email (unlocks Feed)
      description: |
        Saves the user's email and completes onboarding. This is the only endpoint that sets `partialProfileComplete = true`, which is the gate that grants Feed access.

        Email is stored lowercase. It is **not** a login credential — phone is. Used only for ticket delivery and reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: sayantan@cirkle.live
      responses:
        '200':
          description: Onboarding complete — Feed access unlocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  currentOnboardingStep:
                    type: integer
                  partialProfileComplete:
                    type: boolean
              example:
                success: true
                currentOnboardingStep: 7
                partialProfileComplete: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── PROFILE ──────────────────────────────────────────────────────────

  /profile/me:
    get:
      tags: [Profile]
      summary: Get own profile
      description: Returns the complete profile of the logged-in user. DOB is never returned — age is derived on read. All optional fields (bio, tagline) are present in the response as null if not yet set.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Profile]
      summary: Edit own profile
      description: |
        Partial update — only fields included in the request body are updated. Omitted fields stay unchanged.

        **Immutable field:** `gender` cannot be changed once set. Attempting to update it returns 400.

        **Set replacement:** `lifestyleTagIds` and `photos` replace the entire existing set — send the full desired set, not a diff.

        All updates run inside a single transaction with a row-level lock to prevent race conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 2
                  example: Sayantan
                lastName:
                  type: string
                  minLength: 2
                  example: Roy
                bio:
                  type: string
                  example: Love live music and meeting new people
                tagline:
                  type: string
                  example: Always up for an adventure
                gender:
                  type: string
                  enum: [man, woman, non_binary, prefer_not_to_say]
                  description: Immutable once set — returns 400 if already set
                cityId:
                  type: string
                  example: del
                email:
                  type: string
                  format: email
                  example: sayantan@cirkle.live
                facebook:
                  type: string
                  nullable: true
                  description: >-
                    Handle, @handle, profile URL, or facebook.com/profile.php?id=N
                    — normalized to the bare handle on write. Send '' or null to
                    clear. An unparseable value returns 400. Optional: there is no
                    onboarding step for these, they're set here or from the
                    just-in-time dialog when an event requires them.
                  example: https://facebook.com/sayantan.roy
                instagram:
                  type: string
                  nullable: true
                  description: Handle, @handle, or profile URL — normalized to the bare handle. '' or null clears.
                  example: '@sayantanroy'
                linkedin:
                  type: string
                  nullable: true
                  description: Vanity slug or a linkedin.com/in/<slug> URL — normalized to the bare slug. '' or null clears.
                  example: https://www.linkedin.com/in/sayantan-roy/
                lifestyleTagIds:
                  type: array
                  minItems: 3
                  maxItems: 5
                  items:
                    type: string
                    format: uuid
                photos:
                  type: array
                  minItems: 2
                  maxItems: 4
                  description: Replaces the entire existing photo set. Each s3Key is verified against S3 (via HeadObject) before saving — all-or-nothing.
                  items:
                    type: object
                    properties:
                      s3Key:
                        type: string
                        description: The key returned by POST /uploads/profile-photo-url, after the file has been PUT to S3
                      position:
                        type: integer
                        minimum: 0
                        maximum: 3
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          description: Validation error, gender already set, or one or more photos were not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    error: First name must be at least 2 characters
                notUploaded:
                  value:
                    error: One or more photos were not uploaded successfully. Please try again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── EVENTS ───────────────────────────────────────────────────────────

  /events:
    get:
      tags: [Events]
      summary: Get events feed
      description: |
        Returns events for the active city, ordered by start time ascending.

        - **Default city:** the user's profile city set during onboarding.
        - **Override city:** pass `?city=mum` to browse events in another city.
        - **Category filter:** pass `?category=concert` to filter by event type.

        Both params can be combined: `?city=del&category=club`
      parameters:
        - in: query
          name: city
          schema:
            type: string
            example: mum
          required: false
          description: Override the default city. Must be a valid city slug from GET /cities.
        - in: query
          name: category
          schema:
            type: string
            enum: [club, concert, trip, meetup]
            example: concert
          required: false
          description: Filter by event category.
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /events/{id}:
    get:
      tags: [Events]
      summary: Get event detail
      description: Returns full detail for a single event by ID. This is the generic state — no group context. The via-anchor state (showing a specific group's info on this screen) is added in the Groups phase.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Event UUID
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Event not found
        '500':
          $ref: '#/components/responses/InternalError'

  /events/{id}/attendees:
    get:
      tags: [Events]
      summary: Who's going to this event
      description: |
        The attendee roster behind the "Who's Going" section on event detail.

        **Visibility:** any logged-in user may read this for any event. Holding a ticket is NOT required — the list is social proof that drives bookings, so gating it behind a purchase would defeat its purpose.

        **What it does not contain:** no phone, no email, no lastName, no bio, no social handles, no date of birth. The backing query selects only the columns in PersonCard, so none of those can appear even if the response builder were wrong. This is narrower than the organizer-facing attendee card, which deliberately includes social handles — see OrganizerProfileCard.

        **One row per person, not per ticket.** A user holding two tickets to the same event appears once, and `total` is a distinct count of people, so "24 attending" means 24 people.

        **The viewer's own row** is included when they hold a ticket, flagged `isYou: true` rather than filtered out — otherwise `total` would disagree with the roster. (This differs from GET /vibes, which excludes the viewer because it's a discovery feed, not a roster.)

        No date filter: past and in-progress events still return their attendees.

        Each entry carries the full profile card, so tapping a person renders their profile from this payload with no follow-up request.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Event UUID
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Clamped to 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: An offset beyond the end returns an empty data array and the true total
      responses:
        '200':
          description: The attendee roster. Empty data with total 0 when nobody is attending — never a 404.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventAttendee'
                  total:
                    type: integer
                    description: Distinct attendees for the whole event, independent of limit/offset
                  limit:
                    type: integer
                  offset:
                    type: integer
              example:
                data:
                  - id: 3f8a1c22-6d54-4e91-b0a7-2c9e5f1d8b34
                    firstName: Priya
                    age: 26
                    gender: woman
                    tagline: Always up for an adventure
                    photos:
                      - url: https://cirkle-user-photos.s3.ap-south-1.amazonaws.com/profiles/3f8a1c22/photo-0.jpg?X-Amz-Signature=...
                        position: 0
                    lifestyleTags:
                      - label: Live music
                        category: Music
                    isYou: false
                  - id: 91b4e7d0-2a18-4c63-8f52-7e0d3a6c9b15
                    firstName: Rahul
                    age: 29
                    gender: man
                    tagline: null
                    photos: []
                    lifestyleTags: []
                    isYou: true
                total: 24
                limit: 50
                offset: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Event not found
        '500':
          $ref: '#/components/responses/InternalError'

  /events/{id}/invitations:
    post:
      tags: [Events]
      summary: Request an invitation to an invite-only event
      description: |
        Creates a 'pending' invitation request for the logged-in user. Only valid for events with `eventType: invite_only`.

        A UNIQUE(user_id, event_id) constraint enforces one request per user per event — you cannot request twice while pending, re-request after rejection, or request again after acceptance. Attempting any of those returns 409 with the existing status.

        Approval/rejection happens outside this API (organizer tooling, out of scope). Poll `GET /events/{id}` to see `invitationStatus` change.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Event UUID
      responses:
        '201':
          description: Invitation request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
        '400':
          description: Event is not invite-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This event does not require an invitation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The event requires social handles the user hasn't supplied. Checked before the request row is created, so the organizer is guaranteed to see the required handles on every request card they decide on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialHandlesRequired'
              example:
                error: social_handles_required
                missing: [instagram]
                message: This event requires your instagram handle.
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A request already exists for this user and event
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  status:
                    type: string
                    enum: [pending, accepted, rejected]
              examples:
                alreadyPending:
                  value:
                    error: You have already requested an invitation
                    status: pending
                alreadyAccepted:
                  value:
                    error: Your invitation is already accepted
                    status: accepted
                alreadyRejected:
                  value:
                    error: Access to this event has been denied
                    status: rejected
        '500':
          $ref: '#/components/responses/InternalError'

# ─── COMPONENTS ───────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/login. Valid for 7 days.

  parameters:
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        default: 50
        maximum: 100
        minimum: 1
      required: false
      description: Max rows to return. Default 50, clamped to 100 even if a larger value is requested.
    Offset:
      in: query
      name: offset
      schema:
        type: integer
        default: 0
        minimum: 0
      required: false

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message here

    Admin:
      type: object
      description: password_hash is never included in any response.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: admin@cirkle.live
        displayName:
          type: string
          example: Founder Admin
        role:
          type: string
          enum: [administrative, business_development]
          description: Only capability difference is manage_admins — administrative has it, business_development doesn't. Otherwise identical access.
        isActive:
          type: boolean
          description: Kill switch. A deactivated admin's existing token stops working immediately, not just at expiry. Absent from the login response (implied true — login already checked it).
        createdAt:
          type: string
          format: date-time

    Organizer:
      type: object
      description: password_hash is never included in any response.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          example: organizer@venue.com
        displayName:
          type: string
          example: Kitty Su
          description: Business name shown in the organizer dashboard
        instagram:
          type: string
          nullable: true
          description: Bare handle, no @ and no URL — normalized on write. Shown as an icon link on the consumer event-detail page. Optional.
          example: kittysu
        isActive:
          type: boolean
          description: Kill switch — disables login without deleting the account
        createdAt:
          type: string
          format: date-time
        eventCount:
          type: integer
          description: Present on GET /admin/organizers and GET /admin/organizers/{id}, absent on create

    EventArtist:
      type: object
      description: >-
        One performer on an event's lineup. Event-scoped, not a global artist
        catalogue — the same performer at two events is two rows with two ids.
        Identical shape on the admin and consumer endpoints; neither exposes
        the raw photo_s3_key.
      properties:
        id:
          type: string
          format: uuid
          description: Send this back in PUT /admin/events/{id}/artists to update in place and keep the photo, and use it to key photo uploads.
        name:
          type: string
          example: Arijit Singh
        instagram:
          type: string
          nullable: true
          description: Bare handle — no @, no URL. Build the link as https://instagram.com/{instagram}.
          example: arijitsingh
        photoUrl:
          type: string
          nullable: true
          description: Presigned GET URL, ~1 hour TTL. Null when the artist has no photo — the frontend supplies its own default avatar.
        position:
          type: integer
          minimum: 0
          maximum: 9
          description: Lineup order; 0 is the headliner

    AdminEvent:
      type: object
      description: The admin's view of an event — includes fields not exposed to attendees (capacity, organizerId, timestamps).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
        cityId:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        price:
          type: integer
          description: Paise
        capacity:
          type: integer
          nullable: true
          description: Null = uncapped
        targetGroupSize:
          type: integer
        eventType:
          type: string
          enum: [open, invite_only]
        venueName:
          type: string
          nullable: true
        venueAddress:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        organizerId:
          type: string
          format: uuid
          nullable: true
        requireFacebook:
          type: boolean
          description: >-
            Settable on create and PATCH. Requires the attendee to have supplied
            a Facebook handle before buying or requesting an invitation. Not
            retroactive — evaluated only at the moment of purchase/request, so
            turning it on never invalidates tickets already sold. Changes are
            captured in the event's audit_log diff.
        requireInstagram:
          type: boolean
          description: As requireFacebook, for Instagram.
        requireLinkedin:
          type: boolean
          description: As requireFacebook, for LinkedIn.
        organizerName:
          type: string
          nullable: true
          description: Present on GET /admin/events (list) only
        organizer:
          type: object
          nullable: true
          description: Present on GET /admin/events/{id} (detail) only
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            displayName:
              type: string
        bannerUrl:
          type: string
          nullable: true
          description: Presigned GET URL, ~1 hour TTL
        gallery:
          type: array
          description: Present on GET /admin/events/{id} (detail) only
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              s3Key:
                type: string
                description: >-
                  Raw stored key. Admin-only — send it back in PUT
                  /admin/events/{id}/gallery to keep an existing photo, since
                  that endpoint is a full replace. Consumer responses never
                  include this.
                example: events/6f1c.../gallery/9ab2....webp
              url:
                type: string
              position:
                type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaginationEnvelope:
      type: object
      description: Shared shape for every list endpoint. `data` is added per-endpoint via allOf.
      properties:
        total:
          type: integer
          description: Total matching rows, ignoring limit/offset — for "showing X-Y of Z" and page controls
          example: 3847
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 100

    AdminOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, paid, failed, expired, refunded]
        breakdown:
          $ref: '#/components/schemas/PriceBreakdown'
        paymentMethod:
          type: string
          nullable: true
          example: upi
        paymentMethodDetail:
          type: string
          nullable: true
          example: PhonePe
        razorpayOrderId:
          type: string
        razorpayPaymentId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        user:
          type: object
          description: PII — phone is unmasked for now. See Admin — Users schema notes.
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
              nullable: true
            phone:
              type: string

    AdminTicket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: CRKL-7F3A2C9E
        checkedIn:
          type: boolean
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            startsAt:
              type: string
              format: date-time
        user:
          type: object
          description: PII — phone is unmasked for now.
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
              nullable: true
            phone:
              type: string

    RevenueSummary:
      type: object
      description: Computed only from status='paid' orders. grossPaise - discountsPaise = netBeforeGstPaise; netBeforeGstPaise + gstCollectedPaise = totalCollectedPaise.
      properties:
        grossPaise:
          type: integer
          description: Sum of base_price_paise across paid orders
        discountsPaise:
          type: integer
        netBeforeGstPaise:
          type: integer
        gstCollectedPaise:
          type: integer
        totalCollectedPaise:
          type: integer
          description: What actually hit Razorpay
        paidOrderCount:
          type: integer
        ticketsSold:
          type: integer
        refundedPaise:
          type: integer
          description: Sum of total_paise across status='refunded' orders. Deliberately NOT subtracted from the collected totals above — shown separately so nothing is hidden.

    RevenueByEvent:
      type: object
      description: Same fields as RevenueSummary, scoped to one event.
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        eventStartsAt:
          type: string
          format: date-time
        grossPaise:
          type: integer
        discountsPaise:
          type: integer
        netBeforeGstPaise:
          type: integer
        gstCollectedPaise:
          type: integer
        totalCollectedPaise:
          type: integer
        paidOrderCount:
          type: integer
        ticketsSold:
          type: integer
        refundedPaise:
          type: integer

    AdminInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          type: string
