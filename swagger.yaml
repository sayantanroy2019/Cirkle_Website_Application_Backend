openapi: 3.0.0

info:
  title: Cirkle API
  version: 1.0.0
  description: |
    ## Cirkle — Social Events Platform API

    Cirkle is an AI-native social discovery platform for people to find their tribe and attend events together.

    ### Authentication
    All endpoints except `GET /cities`, `GET /lifestyle-tags`, and `POST /auth/login` require a Bearer token.

    Include the token in every protected request:
    Authorization: Bearer <your_jwt_token>

    ### Price Format
    All prices are in **paise** (₹1 = 100 paise). Example: ₹500 = `50000`.

    ### Phone Format
    Indian mobile numbers only. Format: `+91XXXXXXXXXX` where the 10-digit number starts with 6, 7, 8, or 9.

servers:
  - url: http://localhost:3000
    description: Development server

security:
  - bearerAuth: []

tags:
  - name: Reference
    description: Static reference data — cities and lifestyle tags. No auth required. Safe to cache on the client.
  - name: Auth
    description: Phone-based authentication. One endpoint handles both signup and login.
  - name: Onboarding
    description: Seven sequential steps to complete a user profile. All require auth. Steps can be revisited without losing progress.
  - name: Profile
    description: View and edit the logged-in user's profile.
  - name: Events
    description: Browse and view events. City-filtered by default, overridable via query param.
  - name: Coupons
    description: Coupon preview and validation.
  - name: Payments
    description: Order creation, payment verification, and status polling. Razorpay-backed.
  - name: Tickets
    description: The user's purchased tickets. Pure proof-of-purchase — no group or payment-flow data.

paths:

  # ─── COUPONS ──────────────────────────────────────────────────────────

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Preview a coupon
      description: |
        Validates a coupon against an event and returns the recomputed price breakdown so the checkout screen can update live.

        Reserves nothing. The order endpoint re-validates independently — a successful preview here is **not** authorization to charge a discounted amount.

        GST is computed on the post-discount subtotal. A flat coupon larger than the ticket price is clamped so the subtotal never goes negative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, eventId]
              properties:
                code:
                  type: string
                  example: CIRKLE100
                eventId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Coupon is valid — breakdown returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  couponCode:
                    type: string
                    example: CIRKLE100
                  breakdown:
                    $ref: '#/components/schemas/PriceBreakdown'
        '400':
          description: Coupon invalid, expired, exhausted, or not applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This coupon has expired
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── PAYMENTS ─────────────────────────────────────────────────────────

  /payments/orders:
    post:
      tags: [Payments]
      summary: Create order and start checkout
      description: |
        Claims a seat hold and creates a Razorpay order. The amount is computed server-side from the event price, an optional coupon, and the current GST rate — never accepted from the client.

        If the user already holds a live hold for this event, the existing order is **resumed** (same Razorpay order, same frozen price) rather than duplicated. `resumed: true` indicates this.

        The full price breakdown is frozen onto the order at creation and returned here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                  format: uuid
                couponCode:
                  type: string
                  example: CIRKLE100
                  description: Optional
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '200':
          description: Existing live hold resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          description: Missing event, or coupon became invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invite-only event — an accepted invitation is required before purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: An accepted invitation is required to buy a ticket to this event
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot buy — already ticketed, sold out, or event started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyTicketed:
                  value:
                    error: You already have a ticket to this event
                soldOut:
                  value:
                    error: This event is sold out
                started:
                  value:
                    error: This event has already started
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/orders/verify:
    post:
      tags: [Payments]
      summary: Verify payment (fast path)
      description: |
        Relayed by the browser after Razorpay's checkout handler fires. Verifies the checkout signature, marks the order paid, and creates the ticket.

        This endpoint failing does **not** mean the payment failed — it means the browser relay failed. The client must fall back to polling `GET /payments/orders/{id}`, never show an error.

        Idempotent: the webhook may have already confirmed this order, in which case the existing ticket is returned unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id:
                  type: string
                  example: order_Nx8kL2mP9qR3sT
                razorpay_payment_id:
                  type: string
                  example: pay_Nx8kL5mP9qR3sT
                razorpay_signature:
                  type: string
      responses:
        '200':
          description: Payment confirmed, ticket created (or already existed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  orderId:
                    type: string
                    format: uuid
                  bookingRef:
                    type: string
                    example: CRKL-7F3A2C9E
        '400':
          description: Missing fields or signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate ticket — charged twice, refund will be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/orders/{id}:
    get:
      tags: [Payments]
      summary: Poll order status
      description: |
        Returns the current status of an order, scoped to the owner. The client polls this when the verify relay fails, waiting for the webhook to confirm the payment independently.

        `bookingRef` is null until the ticket exists. The signal to stop polling is `status: paid`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [created, paid, failed, expired, refunded]
                  totalPaise:
                    type: integer
                  eventId:
                    type: string
                    format: uuid
                  bookingRef:
                    type: string
                    nullable: true
                    example: CRKL-7F3A2C9E
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/razorpay:
    post:
      tags: [Payments]
      summary: Razorpay webhook (server-to-server)
      description: |
        Authoritative payment confirmation from Razorpay. Not called by clients — listed for completeness.

        Verifies the webhook signature over the raw request body (different secret and payload from the checkout signature), then performs the same idempotent confirmation as the verify endpoint. Returns 200 even when ignoring an event, so Razorpay stops retrying; returns 500 only on transient failure, where a retry should succeed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook payload (payment.captured)
      responses:
        '200':
          description: Received (processed or intentionally ignored)
        '400':
          description: Missing or invalid signature
        '500':
          description: Transient processing failure — Razorpay will retry

  # ─── TICKETS ──────────────────────────────────────────────────────────

  /tickets:
    get:
      tags: [Tickets]
      summary: List my tickets
      description: |
        The My Tickets list. Pure proof-of-purchase logistics — never any group, anchor, or payment-flow data, by design.
      parameters:
        - in: query
          name: filter
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
          description: Upcoming events (not yet started) or past events.
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketListItem'
        '400':
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail
      description: |
        Full ticket detail including the booking reference the QR encodes and the price paid. Scoped to the owner. No group information appears here.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: '#/components/schemas/TicketDetail'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── REFERENCE ────────────────────────────────────────────────────────

  /reference/cities:
    get:
      tags: [Reference]
      summary: Get all cities
      description: Returns the fixed list of Indian cities. Used in onboarding step 4 (city selection) and the Feed city switcher. No auth required.
      security: []
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
              example:
                cities:
                  - id: del
                    name: Delhi NCR
                  - id: mum
                    name: Mumbai
        '500':
          $ref: '#/components/responses/InternalError'

  /reference/lifestyle-tags:
    get:
      tags: [Reference]
      summary: Get all lifestyle tags
      description: Returns all lifestyle tags ordered by category. Used in onboarding step 5 and Edit Profile. The frontend groups tags by the category field. Min 3, max 5 selectable per user. No auth required.
      security: []
      responses:
        '200':
          description: List of lifestyle tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  lifestyleTags:
                    type: array
                    items:
                      $ref: '#/components/schemas/LifestyleTag'
              example:
                lifestyleTags:
                  - id: be1c46e0-e44b-4776-89fd-e15b97b95fc7
                    label: Clubbing
                    category: Going out
                  - id: 54e18447-c11a-4613-9b18-6e71f8012f2a
                    label: Gym
                    category: Active & outdoors
        '500':
          $ref: '#/components/responses/InternalError'

  /reference/event-categories:
    get:
      tags: [Reference]
      summary: Get all event categories
      description: Returns the fixed list of event categories. Powers the Events-tab filter chips and the `?category=` filter on GET /events. No auth required.
      security: []
      responses:
        '200':
          description: List of event categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventCategories:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventCategory'
              example:
                eventCategories:
                  - id: club
                    label: Clubs
                  - id: concert
                    label: Concerts
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── AUTH ─────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login or create account
      description: |
        Single endpoint for both signup and login — no split. Sends phone number, gets a JWT back.

        - **New user:** creates a user row + empty profile row atomically, returns `isNewUser: true`.
        - **Returning user:** verifies phone against stored hash, returns `isNewUser: false` with current onboarding progress.

        The frontend uses `isNewUser` + `currentOnboardingStep` to decide where to route the user after login.

        > **Phase 1 stub:** uses phone-as-password (bcrypt). Replaced by real OTP at final phase.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+919876543210"
                  description: Indian mobile number with +91 prefix. Must start with 6, 7, 8, or 9.
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT valid for 7 days
                  isNewUser:
                    type: boolean
                    description: True if account was just created
                  currentOnboardingStep:
                    type: integer
                    minimum: 0
                    maximum: 7
                    description: Which onboarding step to resume at
                  partialProfileComplete:
                    type: boolean
                    description: True if the user can access the Feed
              example:
                token: eyJhbGciOiJIUzI1NiJ9...
                isNewUser: true
                currentOnboardingStep: 0
                partialProfileComplete: false
        '400':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid phone number
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── ONBOARDING ───────────────────────────────────────────────────────

  /onboarding/status:
    get:
      tags: [Onboarding]
      summary: Get onboarding status
      description: Returns the current onboarding step and Feed access flag for the logged-in user. The frontend calls this on app launch to decide where to route the user — onboarding screen N, or straight to the Feed.
      responses:
        '200':
          description: Current onboarding progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentOnboardingStep:
                    type: integer
                    minimum: 0
                    maximum: 7
                  partialProfileComplete:
                    type: boolean
              example:
                currentOnboardingStep: 3
                partialProfileComplete: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/1:
    patch:
      tags: [Onboarding]
      summary: Step 1 — Save name
      description: Saves the user's first and last name. Both are required, minimum 2 characters each. Displayed publicly as "FirstName, Age" everywhere on the platform.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                  minLength: 2
                  example: Sayantan
                lastName:
                  type: string
                  minLength: 2
                  example: Roy
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/2:
    patch:
      tags: [Onboarding]
      summary: Step 2 — Save date of birth
      description: Saves the user's date of birth in YYYY-MM-DD format. DOB is stored but never returned by any API — age is derived on read. No age restriction enforced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateOfBirth]
              properties:
                dateOfBirth:
                  type: string
                  format: date
                  example: "2000-05-15"
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/3:
    patch:
      tags: [Onboarding]
      summary: Step 3 — Save gender
      description: Saves the user's gender. Must be one of the four allowed values. Gender is immutable once set — it cannot be changed via Edit Profile later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gender]
              properties:
                gender:
                  type: string
                  enum: [man, woman, non_binary, prefer_not_to_say]
                  example: man
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/4:
    patch:
      tags: [Onboarding]
      summary: Step 4 — Save city
      description: Saves the user's home city. Must be a valid city slug from GET /cities. Determines which events and groups the user sees by default in the Feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cityId]
              properties:
                cityId:
                  type: string
                  example: del
                  description: Must be a valid city slug from GET /cities
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/5:
    patch:
      tags: [Onboarding]
      summary: Step 5 — Save lifestyle tags
      description: Saves the user's lifestyle tag selections. Min 3, max 5. Replaces the entire existing selection — send the full desired set, not a diff. These tags appear on the user's anchor card in the Groups feed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifestyleTagIds]
              properties:
                lifestyleTagIds:
                  type: array
                  minItems: 3
                  maxItems: 5
                  items:
                    type: string
                    format: uuid
                  example:
                    - be1c46e0-e44b-4776-89fd-e15b97b95fc7
                    - 54e18447-c11a-4613-9b18-6e71f8012f2a
                    - f184d05f-24ec-4148-953f-7f007fcaf7bc
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/6:
    patch:
      tags: [Onboarding]
      summary: Step 6 — Save photos
      description: |
        Saves the user's profile photos. Min 2, max 4. Position 0 is the Main photo and is required. Replaces the entire existing photo set on every call.

        > **Stubbed in Phase 1:** accepts s3Key strings directly. Real flow (pre-launch): client gets a presigned S3 URL, uploads directly to S3, then sends the returned s3Key here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    required: [s3Key, position]
                    properties:
                      s3Key:
                        type: string
                        example: profiles/user-id/photo-0.jpg
                      position:
                        type: integer
                        minimum: 0
                        maximum: 3
                        description: Position 0 is the Main photo
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStepSuccess'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /onboarding/step/7:
    patch:
      tags: [Onboarding]
      summary: Step 7 — Save email (unlocks Feed)
      description: |
        Saves the user's email and completes onboarding. This is the only endpoint that sets `partialProfileComplete = true`, which is the gate that grants Feed access.

        Email is stored lowercase. It is **not** a login credential — phone is. Used only for ticket delivery and reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: sayantan@cirkle.live
      responses:
        '200':
          description: Onboarding complete — Feed access unlocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  currentOnboardingStep:
                    type: integer
                  partialProfileComplete:
                    type: boolean
              example:
                success: true
                currentOnboardingStep: 7
                partialProfileComplete: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── PROFILE ──────────────────────────────────────────────────────────

  /profile/me:
    get:
      tags: [Profile]
      summary: Get own profile
      description: Returns the complete profile of the logged-in user. DOB is never returned — age is derived on read. All optional fields (bio, tagline) are present in the response as null if not yet set.
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Profile]
      summary: Edit own profile
      description: |
        Partial update — only fields included in the request body are updated. Omitted fields stay unchanged.

        **Immutable field:** `gender` cannot be changed once set. Attempting to update it returns 400.

        **Set replacement:** `lifestyleTagIds` and `photos` replace the entire existing set — send the full desired set, not a diff.

        All updates run inside a single transaction with a row-level lock to prevent race conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 2
                  example: Sayantan
                lastName:
                  type: string
                  minLength: 2
                  example: Roy
                bio:
                  type: string
                  example: Love live music and meeting new people
                tagline:
                  type: string
                  example: Always up for an adventure
                gender:
                  type: string
                  enum: [man, woman, non_binary, prefer_not_to_say]
                  description: Immutable once set — returns 400 if already set
                cityId:
                  type: string
                  example: del
                email:
                  type: string
                  format: email
                  example: sayantan@cirkle.live
                lifestyleTagIds:
                  type: array
                  minItems: 3
                  maxItems: 5
                  items:
                    type: string
                    format: uuid
                photos:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items:
                    type: object
                    properties:
                      s3Key:
                        type: string
                      position:
                        type: integer
                        minimum: 0
                        maximum: 3
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
              example:
                success: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── EVENTS ───────────────────────────────────────────────────────────

  /events:
    get:
      tags: [Events]
      summary: Get events feed
      description: |
        Returns events for the active city, ordered by start time ascending.

        - **Default city:** the user's profile city set during onboarding.
        - **Override city:** pass `?city=mum` to browse events in another city.
        - **Category filter:** pass `?category=concert` to filter by event type.

        Both params can be combined: `?city=del&category=club`
      parameters:
        - in: query
          name: city
          schema:
            type: string
            example: mum
          required: false
          description: Override the default city. Must be a valid city slug from GET /cities.
        - in: query
          name: category
          schema:
            type: string
            enum: [club, concert, trip, meetup]
            example: concert
          required: false
          description: Filter by event category.
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /events/{id}:
    get:
      tags: [Events]
      summary: Get event detail
      description: Returns full detail for a single event by ID. This is the generic state — no group context. The via-anchor state (showing a specific group's info on this screen) is added in the Groups phase.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Event UUID
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Event not found
        '500':
          $ref: '#/components/responses/InternalError'

  /events/{id}/invitations:
    post:
      tags: [Events]
      summary: Request an invitation to an invite-only event
      description: |
        Creates a 'pending' invitation request for the logged-in user. Only valid for events with `eventType: invite_only`.

        A UNIQUE(user_id, event_id) constraint enforces one request per user per event — you cannot request twice while pending, re-request after rejection, or request again after acceptance. Attempting any of those returns 409 with the existing status.

        Approval/rejection happens outside this API (organizer tooling, out of scope). Poll `GET /events/{id}` to see `invitationStatus` change.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Event UUID
      responses:
        '201':
          description: Invitation request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
        '400':
          description: Event is not invite-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This event does not require an invitation
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A request already exists for this user and event
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  status:
                    type: string
                    enum: [pending, accepted, rejected]
              examples:
                alreadyPending:
                  value:
                    error: You have already requested an invitation
                    status: pending
                alreadyAccepted:
                  value:
                    error: Your invitation is already accepted
                    status: accepted
                alreadyRejected:
                  value:
                    error: Access to this event has been denied
                    status: rejected
        '500':
          $ref: '#/components/responses/InternalError'

# ─── COMPONENTS ───────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from POST /auth/login. Valid for 7 days.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Error message here

    City:
      type: object
      properties:
        id:
          type: string
          example: del
          description: City slug identifier
        name:
          type: string
          example: Delhi NCR

    EventCategory:
      type: object
      properties:
        id:
          type: string
          example: club
          description: Category slug identifier — used in ?category= query params
        label:
          type: string
          example: Clubs

    LifestyleTag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: be1c46e0-e44b-4776-89fd-e15b97b95fc7
        label:
          type: string
          example: Clubbing
        category:
          type: string
          example: Going out

    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        s3Key:
          type: string
          example: profiles/user-id/photo-0.jpg
        position:
          type: integer
          minimum: 0
          maximum: 3
          description: Position 0 is the Main photo

    Profile:
      type: object
      properties:
        firstName:
          type: string
          example: Sayantan
        lastName:
          type: string
          example: Roy
        age:
          type: integer
          example: 26
          description: Derived from DOB on read — DOB is never returned directly
        gender:
          type: string
          enum: [man, woman, non_binary, prefer_not_to_say]
          description: Immutable once set
        cityId:
          type: string
          example: del
        email:
          type: string
          example: sayantan@cirkle.live
        bio:
          type: string
          nullable: true
          example: Love live music
        tagline:
          type: string
          nullable: true
          example: Always up for an adventure
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        lifestyleTags:
          type: array
          items:
            $ref: '#/components/schemas/LifestyleTag'

    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Sunidhi Chauhan Live
        categoryId:
          type: string
          example: concert
        cityId:
          type: string
          example: del
        startsAt:
          type: string
          format: date-time
          example: "2026-08-14T19:00:00+05:30"
        endsAt:
          type: string
          format: date-time
          nullable: true
        price:
          type: integer
          example: 50000
          description: In paise. ₹500 = 50000
        targetGroupSize:
          type: integer
          example: 4
        venueName:
          type: string
          example: Jawaharlal Nehru Stadium
        venueAddress:
          type: string
          example: Lodhi Road, New Delhi
        description:
          type: string
          nullable: true
        bannerS3Key:
          type: string
          nullable: true
        userHasTicket:
          type: boolean
          description: Whether the requesting user already holds a ticket to this event (only present on GET /events/{id})
        soldOut:
          type: boolean
          description: Whether a capped event has no seats left (only present on GET /events/{id})
        eventType:
          type: string
          enum: [open, invite_only]
          description: If invite_only, an accepted invitation is required before POST /payments/orders will succeed (only present on GET /events/{id})
        invitationStatus:
          type: string
          nullable: true
          enum: [pending, accepted, rejected]
          description: The requesting user's invitation status for an invite_only event. Null if no request has been made yet, or if the event is open (only present on GET /events/{id})

    PriceBreakdown:
      type: object
      description: All amounts in paise. GST is computed on the post-discount subtotal.
      properties:
        basePricePaise:
          type: integer
          example: 50000
        discountPaise:
          type: integer
          example: 10000
          description: Clamped to base price — never exceeds it
        subtotalPaise:
          type: integer
          example: 40000
          description: base − discount
        gstPercentage:
          type: number
          example: 18
        gstPaise:
          type: integer
          example: 7200
          description: Rounded to the nearest paisa
        totalPaise:
          type: integer
          example: 47200
          description: What Razorpay charges

    OrderCreated:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          description: Cirkle's order ID — used for status polling
        razorpayOrderId:
          type: string
          example: order_Nx8kL2mP9qR3sT
          description: Razorpay's order ID — passed to the checkout SDK
        razorpayKeyId:
          type: string
          example: rzp_test_XXXXXXXX
          description: Public key ID for the checkout SDK
        amount:
          type: integer
          example: 47200
          description: Total in paise, equals breakdown.totalPaise
        currency:
          type: string
          example: INR
        expiresAt:
          type: string
          format: date-time
          description: When the seat hold lapses
        resumed:
          type: boolean
          description: True if an existing live hold was returned instead of a new order
        breakdown:
          $ref: '#/components/schemas/PriceBreakdown'

    TicketListItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: CRKL-7F3A2C9E
        checkedIn:
          type: boolean
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            categoryId:
              type: string
            startsAt:
              type: string
              format: date-time
            venueName:
              type: string
            venueAddress:
              type: string
            bannerS3Key:
              type: string
              nullable: true

    TicketDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingRef:
          type: string
          example: CRKL-7F3A2C9E
          description: The string the QR code encodes
        checkedIn:
          type: boolean
        pricePaid:
          type: integer
          example: 47200
          description: In paise
        bookedAt:
          type: string
          format: date-time
        event:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            categoryId:
              type: string
            startsAt:
              type: string
              format: date-time
            venueName:
              type: string
            venueAddress:
              type: string
            bannerS3Key:
              type: string
              nullable: true

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: No token provided

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation error message

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error

    OnboardingStepSuccess:
      description: Step saved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              currentOnboardingStep:
                type: integer
          example:
            success: true
            currentOnboardingStep: 1