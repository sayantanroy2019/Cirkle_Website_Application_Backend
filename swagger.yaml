      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/AdminEvent'
        '400':
          description: Validation error (missing required field, invalid categoryId/cityId/organizerId, startsAt not in the future, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Admin — Events]
      summary: List all events
      description: List view includes a presigned bannerUrl (batch-signed) but not the gallery — that's detail-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: organizerId
          schema:
            type: string
            format: uuid
          required: false
        - in: query
          name: cityId
          schema:
            type: string
          required: false
        - in: query
          name: status
          schema:
            type: string
            enum: [upcoming, past]
          required: false
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminEvent'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}:
    get:
      tags: [Admin — Events]
      summary: Get full event detail
      description: Includes presigned bannerUrl, the full gallery (presigned URLs), and the linked organizer.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/AdminEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Admin — Events]
      summary: Edit an event
      description: |
        Partial update — any field editable, including price and capacity even after tickets are sold.

        **Editing price/capacity does NOT retroactively affect existing orders or tickets** — those freeze their price breakdown at purchase time and never re-read this row. Edits only affect future buyers.

        `startsAt` is only validated as future when it's actually present in the request body — so other fields stay editable on events that have already started.

        Writes an audit_log row with only the fields that actually changed.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                categoryId:
                  type: string
                cityId:
                  type: string
                startsAt:
                  type: string
                  format: date-time
                  description: Validated as future only when present in the body
                endsAt:
                  type: string
                  format: date-time
                  nullable: true
                price:
                  type: integer
                capacity:
                  type: integer
                  nullable: true
                targetGroupSize:
                  type: integer
                eventType:
                  type: string
                  enum: [open, invite_only]
                venueName:
                  type: string
                  nullable: true
                venueAddress:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                organizerId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/AdminEvent'
        '400':
          description: Validation error, or no fields provided to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/image-url:
    post:
      tags: [Admin — Events]
      summary: Get a presigned upload URL for an event image
      description: |
        Same handshake as profile photos: call this, PUT the file bytes directly to the returned uploadUrl, then attach the returned key via PATCH .../banner or PUT .../gallery below.

        Key is server-generated: `events/{eventId}/{kind}/{uuid}.{ext}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, kind]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                kind:
                  type: string
                  enum: [banner, gallery]
      responses:
        '200':
          description: Presigned upload URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    description: PUT the file here directly. Expires in 5 minutes.
                  key:
                    type: string
        '400':
          description: Missing/unsupported contentType, or invalid kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/banner:
    patch:
      tags: [Admin — Events]
      summary: Set the event banner
      description: Verifies the object exists in S3 (HeadObject) before saving — the client claiming an upload happened isn't trusted. Writes an audit_log row with the from/to key.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key:
                  type: string
                  description: The key returned by POST .../image-url, after the file has been PUT to S3
      responses:
        '200':
          description: Banner set
          content:
            application/json:
              schema:
                type: object
                properties:
                  bannerUrl:
                    type: string
                    description: Presigned view URL for the new banner
        '400':
          description: Missing s3Key, or the image was not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The image was not uploaded successfully. Please try again.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/gallery:
    put:
      tags: [Admin — Events]
      summary: Replace the event gallery
      description: |
        Replaces the entire gallery — delete-and-reinsert in a transaction, same pattern as profile photos. Max 5 photos, positions 0-4, no duplicate positions.

        All-or-nothing S3 verification: if any key wasn't actually uploaded, the whole request is rejected and nothing is saved (existing gallery untouched).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photos]
              properties:
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [s3Key, position]
                    properties:
                      s3Key:
                        type: string
                      position:
                        type: integer
                        minimum: 0
                        maximum: 4
      responses:
        '200':
          description: Gallery replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  gallery:
                    type: array
                    items:
                      type: object
                      properties:
                        s3Key:
                          type: string
                          description: Echoed back so the response matches the gallery shape in GET /admin/events/{id}
                        url:
                          type: string
                        position:
                          type: integer
        '400':
          description: More than 5 photos, invalid/duplicate positions, or one or more images not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/artists:
    get:
      tags: [Admin — Events]
      summary: List the event's lineup
      description: Artists ordered by position, headliner (position 0) first. photoUrl is presigned, or null when the artist has no photo.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The lineup
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventArtist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin — Events]
      summary: Set the event's lineup
      description: |
        Sets the whole lineup in one call. Max 10 artists, positions 0-9, no duplicate positions.

        This is an **upsert by id**, not a delete-and-reinsert. Include an artist's `id` to update it in place and keep its photo; omit `id` to create a new artist. Any existing artist whose id is absent from the payload is deleted, and its photo reference goes with it.

        That distinction matters: photos are attached per-artist (see the two endpoints below) and keyed to the artist id, so reinserting rows on every edit would orphan every photo. Send back the ids you got from GET.

        Instagram handles are normalized on write — a full profile URL, a leading @, or a bare handle all store as the bare handle. An unparseable value is rejected rather than stored.

        Writes one audit_log row recording the before/after lineup and the names of any removed artists.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artists]
              properties:
                artists:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [name, position]
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Omit to create. Include to update an existing artist in place, preserving its photo. Must belong to this event.
                      name:
                        type: string
                        example: Arijit Singh
                      instagram:
                        type: string
                        nullable: true
                        description: Handle, @handle, or profile URL — normalized to the bare handle. Null or empty clears it.
                        example: arijitsingh
                      position:
                        type: integer
                        minimum: 0
                        maximum: 9
                        description: 0 is the headliner
      responses:
        '200':
          description: The saved lineup, with ids for photo upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  artists:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventArtist'
        '400':
          description: More than 10 artists, missing name, invalid/duplicate position, an unparseable Instagram handle, or an artist id that isn't this event's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/artists/{artistId}/image-url:
    post:
      tags: [Admin — Events]
      summary: Get a presigned upload URL for an artist photo
      description: |
        Same handshake as event images: call this, PUT the file bytes to the returned uploadUrl, then attach the returned key via PATCH .../photo below.

        The artist must already exist — create the lineup with PUT first, then use the ids it returns. The key is server-generated and namespaced to the artist (`events/{eventId}/artists/{artistId}/{uuid}.{ext}`), so a client can never place a file outside its own artist.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: artistId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        '200':
          description: Presigned upload URL, valid 5 minutes
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  key:
                    type: string
                    description: Send this back as s3Key to PATCH .../photo
                    example: events/6f1c.../artists/9ab2.../c3d4.webp
        '400':
          description: Missing contentType, or an unsupported image type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Artist not found on this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/events/{id}/artists/{artistId}/photo:
    patch:
      tags: [Admin — Events]
      summary: Attach (or clear) an artist's photo
      description: |
        Verifies the object exists in S3 before saving — same all-or-nothing rule as the event banner. Also rejects an s3Key that isn't namespaced to this artist, so one artist's photo can't be pointed at another's.

        Send `s3Key: null` to clear the photo; the artist then returns photoUrl null and the frontend shows its default avatar.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: artistId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s3Key]
              properties:
                s3Key:
                  type: string
                  nullable: true
                  description: The key returned by the image-url endpoint, or null to clear
      responses:
        '200':
          description: Photo attached or cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  artistId:
                    type: string
                    format: uuid
                  photoUrl:
                    type: string
                    nullable: true
                    description: Presigned GET URL, or null if the photo was cleared
        '400':
          description: Missing s3Key, a key not belonging to this artist, or the image was not found in S3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Artist not found on this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── ADMIN OVERSIGHT (read-only) ───────────────────────────────────────

  /admin/orders:
