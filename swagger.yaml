openapi: 3.0.0

info:
  title: Cirkle API
  version: 1.0.0
  description: |
    ## Cirkle — Social Events Platform API

    Cirkle is an AI-native social discovery platform for people to find their tribe and attend events together.

    ### Authentication
    All endpoints except `GET /cities`, `GET /lifestyle-tags`, and `POST /auth/login` require a Bearer token.

    Include the token in every protected request:
    Authorization: Bearer <your_jwt_token>

    ### Price Format
    All prices are in **paise** (₹1 = 100 paise). Example: ₹500 = `50000`.

    ### Phone Format
    Indian mobile numbers only. Format: `+91XXXXXXXXXX` where the 10-digit number starts with 6, 7, 8, or 9.

servers:
  - url: http://localhost:3000
    description: Development server

security:
  - bearerAuth: []

tags:
  - name: Reference
    description: Static reference data — cities and lifestyle tags. No auth required. Safe to cache on the client.
  - name: Auth
    description: Phone-based authentication. One endpoint handles both signup and login.
  - name: Onboarding
    description: Seven sequential steps to complete a user profile. All require auth. Steps can be revisited without losing progress.
  - name: Profile
    description: View and edit the logged-in user's profile.
  - name: Events
    description: Browse and view events. City-filtered by default, overridable via query param.
  - name: Coupons
    description: Coupon preview and validation.
  - name: Payments
    description: Order creation, payment verification, and status polling. Razorpay-backed.
  - name: Tickets
    description: The user's purchased tickets. Pure proof-of-purchase — no group or payment-flow data.
  - name: Vibes
    description: Social-proof discovery feed. One card per upcoming ticket held by someone else, ranked by gender/city tiers.
  - name: Uploads
    description: Presigned S3 upload handshake for profile photos. The bucket is private — uploads go straight to S3, never through this backend.
  - name: Admin Auth
    description: Email/password login for internal staff (admins). Separate identity space and JWT secret from attendee auth — an attendee token can never authenticate here, and vice versa.
  - name: Admin — Admins
    description: Admin account management. Restricted to admins with the manage_admins capability (role administrative) — a business_development admin gets 403 on every endpoint in this section.
  - name: Admin — Organizers
    description: Organizer account management. Both admin roles (administrative, business_development) may use every endpoint here.
  - name: Admin — Events
    description: Event creation, editing, and images (banner + gallery). Both admin roles may use every endpoint here. Every mutation writes an audit_log row.
  - name: Admin — Orders
    description: Read-only order oversight. Both admin roles. Every list endpoint is paginated.
  - name: Admin — Tickets
    description: Read-only ticket oversight — filter by event for the venue guest list. Both admin roles.
  - name: Admin — Revenue
    description: Aggregate money views computed only from paid orders. Both admin roles.
  - name: Admin — Invitations
    description: Global read-only view of all invitation activity across every organizer. Both admin roles.
  - name: Admin — Users
    description: Read-only user oversight and the support-lookup screen. Both admin roles. Phone and email are unmasked PII for now — see the Admin — Users schema notes.
  - name: Organizer
    description: |
      The organizer-facing dashboard: read-only event/attendee/invitation views scoped to the logged-in organizer, plus one write action (invitation accept/reject). Separate identity space and JWT secret (ORGANIZER_JWT_SECRET) from both attendee and admin auth.

      Attendee and invitation responses NEVER include phone or email — organizers get profile cards only. Cirkle handles all attendee communication.

paths:

  # ─── COUPONS ──────────────────────────────────────────────────────────

  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Preview a coupon
      description: |
        Validates a coupon against an event and returns the recomputed price breakdown so the checkout screen can update live.

        Reserves nothing. The order endpoint re-validates independently — a successful preview here is **not** authorization to charge a discounted amount.

        GST is computed on the post-discount subtotal. A flat coupon larger than the ticket price is clamped so the subtotal never goes negative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, eventId]
              properties:
                code:
                  type: string
                  example: CIRKLE100
                eventId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Coupon is valid — breakdown returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  couponCode:
                    type: string
                    example: CIRKLE100
                  breakdown:
                    $ref: '#/components/schemas/PriceBreakdown'
        '400':
          description: Coupon invalid, expired, exhausted, or not applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This coupon has expired
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── PAYMENTS ─────────────────────────────────────────────────────────

  /payments/orders:
    post:
      tags: [Payments]
      summary: Create order and start checkout
      description: |
        Claims a seat hold and creates a Razorpay order. The amount is computed server-side from the event price, an optional coupon, and the current GST rate — never accepted from the client.

        If the user already holds a live hold for this event, the existing order is **resumed** (same Razorpay order, same frozen price) rather than duplicated. `resumed: true` indicates this.

        The full price breakdown is frozen onto the order at creation and returned here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                  format: uuid
                couponCode:
                  type: string
                  example: CIRKLE100
                  description: Optional
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '200':
          description: Existing live hold resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          description: Missing event, or coupon became invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Blocked by a gate. Two distinct shapes — branch on the `error` field, not the prose:

            - `social_handles_required` — the event requires social handles the user hasn't supplied. Carries a `missing` array. This gate runs FIRST, before the invitation and capacity checks.
            - otherwise — invite-only event, an accepted invitation is required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SocialHandlesRequired'
                  - $ref: '#/components/schemas/Error'
              examples:
                socialHandlesRequired:
                  summary: Missing required social handles
                  value:
                    error: social_handles_required
                    missing: [instagram, linkedin]
                    message: This event requires your instagram, linkedin handles.
                invitationRequired:
                  summary: Invite-only event, no accepted invitation
                  value:
                    error: An accepted invitation is required to buy a ticket to this event
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cannot buy — already ticketed, sold out, or event started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyTicketed:
                  value:
                    error: You already have a ticket to this event
                soldOut:
                  value:
                    error: This event is sold out
                started:
                  value:
                    error: This event has already started
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/orders/verify:
    post:
      tags: [Payments]
      summary: Verify payment (fast path)
      description: |
        Relayed by the browser after Razorpay's checkout handler fires. Verifies the checkout signature, marks the order paid, and creates the ticket.

        This endpoint failing does **not** mean the payment failed — it means the browser relay failed. The client must fall back to polling `GET /payments/orders/{id}`, never show an error.

        Idempotent: the webhook may have already confirmed this order, in which case the existing ticket is returned unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature]
              properties:
                razorpay_order_id:
                  type: string
                  example: order_Nx8kL2mP9qR3sT
                razorpay_payment_id:
                  type: string
                  example: pay_Nx8kL5mP9qR3sT
                razorpay_signature:
                  type: string
      responses:
        '200':
          description: Payment confirmed, ticket created (or already existed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  orderId:
                    type: string
                    format: uuid
                  bookingRef:
                    type: string
                    example: CRKL-7F3A2C9E
        '400':
          description: Missing fields or signature verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate ticket — charged twice, refund will be processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /payments/orders/{id}:
    get:
      tags: [Payments]
      summary: Poll order status
      description: |
        Returns the current status of an order, scoped to the owner. The client polls this when the verify relay fails, waiting for the webhook to confirm the payment independently.

        `bookingRef` is null until the ticket exists. The signal to stop polling is `status: paid`.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [created, paid, failed, expired, refunded]
                  totalPaise:
                    type: integer
                  eventId:
                    type: string
                    format: uuid
                  bookingRef:
                    type: string
                    nullable: true
                    example: CRKL-7F3A2C9E
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /webhooks/razorpay:
    post:
      tags: [Payments]
      summary: Razorpay webhook (server-to-server)
      description: |
        Authoritative payment confirmation from Razorpay. Not called by clients — listed for completeness.

        Verifies the webhook signature over the raw request body (different secret and payload from the checkout signature), then performs the same idempotent confirmation as the verify endpoint. Returns 200 even when ignoring an event, so Razorpay stops retrying; returns 500 only on transient failure, where a retry should succeed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay webhook payload (payment.captured)
      responses:
        '200':
          description: Received (processed or intentionally ignored)
        '400':
          description: Missing or invalid signature
        '500':
          description: Transient processing failure — Razorpay will retry

  # ─── TICKETS ──────────────────────────────────────────────────────────

  /tickets:
    get:
      tags: [Tickets]
      summary: List my tickets
      description: |
        The My Tickets list. Pure proof-of-purchase logistics — never any group, anchor, or payment-flow data, by design.
      parameters:
        - in: query
          name: filter
          schema:
            type: string
            enum: [upcoming, past]
            default: upcoming
          description: Upcoming events (not yet started) or past events.
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketListItem'
        '400':
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Ticket detail
      description: |
        Full ticket detail including the booking reference the QR encodes and the price paid. Scoped to the owner. No group information appears here.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    $ref: '#/components/schemas/TicketDetail'
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── VIBES ────────────────────────────────────────────────────────────

  /vibes:
    get:
      tags: [Vibes]
      summary: Get the social-proof discovery feed
      description: |
        Returns up to 100 cards, one per upcoming ticket held by someone other than the viewer. Excludes the viewer's own tickets and events that have already started.

        Ordering is five tiers based on the viewer's gender and city vs. each card's person and event city, then soonest event first, then newest ticket as a tiebreak:

        **Male viewer:** woman/same-city (1) → woman/other-city (2) → man/same-city (3) → man/other-city (4) → everyone else (5)

        **Female viewer:** man/same-city (1) → woman/same-city (2) → man/other-city (3) → woman/other-city (4) → everyone else (5)

        **non_binary / prefer_not_to_say viewer:** no gender preference — all cards rank in a single tier, ordered by event date only.

        "Same city" is evaluated against the event's city (where the plan is), not the card's person's home city.
      responses:
        '200':
          description: Discovery feed cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: '#/components/schemas/VibeCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── REFERENCE ────────────────────────────────────────────────────────

  /reference/cities:
    get:
      tags: [Reference]
      summary: Get all cities
      description: Returns the fixed list of Indian cities. Used in onboarding step 4 (city selection) and the Feed city switcher. No auth required.
      security: []
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
              example:
                cities:
                  - id: del
                    name: Delhi NCR
                  - id: mum
                    name: Mumbai
        '500':
          $ref: '#/components/responses/InternalError'

  /reference/lifestyle-tags:
    get:
      tags: [Reference]
      summary: Get all lifestyle tags
      description: Returns all lifestyle tags ordered by category. Used in onboarding step 5 and Edit Profile. The frontend groups tags by the category field. Min 3, max 5 selectable per user. No auth required.
      security: []
      responses:
        '200':
          description: List of lifestyle tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  lifestyleTags:
                    type: array
                    items:
                      $ref: '#/components/schemas/LifestyleTag'
              example:
                lifestyleTags:
                  - id: be1c46e0-e44b-4776-89fd-e15b97b95fc7
                    label: Clubbing
                    category: Going out
                  - id: 54e18447-c11a-4613-9b18-6e71f8012f2a
                    label: Gym
                    category: Active & outdoors
        '500':
          $ref: '#/components/responses/InternalError'

  /reference/event-categories:
    get:
      tags: [Reference]
      summary: Get all event categories
      description: Returns the fixed list of event categories. Powers the Events-tab filter chips and the `?category=` filter on GET /events. No auth required.
      security: []
      responses:
        '200':
          description: List of event categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventCategories:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventCategory'
              example:
                eventCategories:
                  - id: club
                    label: Clubs
                  - id: concert
                    label: Concerts
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── AUTH ─────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [Auth]
      summary: Login or create account
      description: |
        Single endpoint for both signup and login — no split. Sends phone number, gets a JWT back.

        - **New user:** creates a user row + empty profile row atomically, returns `isNewUser: true`.
        - **Returning user:** verifies phone against stored hash, returns `isNewUser: false` with current onboarding progress.

        The frontend uses `isNewUser` + `currentOnboardingStep` to decide where to route the user after login.

        > **Phase 1 stub:** uses phone-as-password (bcrypt). Replaced by real OTP at final phase.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "+919876543210"
                  description: Indian mobile number with +91 prefix. Must start with 6, 7, 8, or 9.
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT valid for 7 days
                  isNewUser:
                    type: boolean
                    description: True if account was just created
                  currentOnboardingStep:
                    type: integer
                    minimum: 0
                    maximum: 7
                    description: Which onboarding step to resume at
                  partialProfileComplete:
                    type: boolean
                    description: True if the user can access the Feed
              example:
                token: eyJhbGciOiJIUzI1NiJ9...
                isNewUser: true
                currentOnboardingStep: 0
                partialProfileComplete: false
        '400':
          description: Invalid phone number format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid phone number
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── UPLOADS ──────────────────────────────────────────────────────────

  /uploads/profile-photo-url:
    post:
      tags: [Uploads]
      summary: Get a presigned upload URL for a profile photo
      description: |
        Step 1 of the upload handshake:

        1. **This endpoint** — call with the file's content type, get back `{ uploadUrl, key }`.
        2. **Client uploads directly to S3** — `PUT` the raw file bytes to `uploadUrl` with a matching `Content-Type` header. This goes straight to S3, never through this backend.
        3. **Save the key** — send the returned `key` as `s3Key` to `PATCH /onboarding/step/6` or `PATCH /profile/me`, which verifies the object actually landed in S3 before saving.

        The key is server-generated (`profiles/{userId}/{uuid}.{ext}`) — the client never chooses where the file lands, which prevents one user overwriting another's photos.

        `uploadUrl` expires in 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  example: image/jpeg
      responses:
        '200':
          description: Presigned upload URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    description: PUT the file here directly. Expires in 5 minutes.
                  key:
                    type: string
                    example: profiles/3d7df698-53b0-4ea8-8e7d-3d7a64099ff1/a1b2c3d4-....jpg
                    description: Send this back as s3Key when saving photos
        '400':
          description: Missing or unsupported contentType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Only JPEG, PNG, and WebP images are allowed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─── ADMIN ────────────────────────────────────────────────────────────

  /admin/auth/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      description: |
        Email/password login for admins. Separate identity space from attendee phone auth — signed with a distinct secret (ADMIN_JWT_SECRET), so this token can never authenticate against attendee routes and an attendee token can never authenticate here.

        Deliberately generic 401 on both "no such email" and "wrong password" — never reveals whether an email exists in the system. Deactivated admins (`is_active = false`) also get the generic 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@cirkle.live
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT valid for 7 days, signed with ADMIN_JWT_SECRET
                  admin:
                    $ref: '#/components/schemas/Admin'
        '400':
          description: Missing or malformed email/password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials, or the account is deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/admins:
    post:
      tags: [Admin — Admins]
      summary: Create an admin account
      description: |
        Creates a new admin (business_development or administrative). This is how administrative admins create BD team accounts.

        Requires the manage_admins capability — a business_development admin gets 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName, role]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                displayName:
                  type: string
                role:
                  type: string
                  enum: [administrative, business_development]
      responses:
        '201':
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: '#/components/schemas/Admin'
        '400':
          description: Validation error (email format, password length, missing displayName, invalid role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks the manage_admins capability (business_development role)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: You do not have permission to manage admin accounts
        '409':
          description: An admin with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Admin — Admins]
      summary: List all admins
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List of admin accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items:
                      $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks the manage_admins capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/admins/{id}:
    patch:
      tags: [Admin — Admins]
      summary: Update an admin account
      description: |
        Partial update — only fields present in the body are changed. Commonly used to deactivate an admin (`isActive: false`), which invalidates their existing token immediately (authenticateAdmin re-checks is_active on every request, not just at token issuance).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                role:
                  type: string
                  enum: [administrative, business_development]
                isActive:
                  type: boolean
      responses:
        '200':
          description: Admin updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: '#/components/schemas/Admin'
        '400':
          description: Validation error, or no fields provided to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
